name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install exact dependency graph
        run: npm ci --ignore-scripts
      - name: Run unit and contract tests
        run: npm test
      - name: Exercise DeepSeek Harness adapter and published host APIs
        run: npm run test:dsh
      - name: Verify isolated DeepSeek Harness package install
        run: npm run verify:dsh:package
      - name: Verify DeepSeek Harness lifecycle receipt
        run: npm run verify:dsh:lifecycle
      - name: Validate repository contracts
        run: npm run validate
      - name: Exercise Hook process boundary
        run: npm run smoke:hooks
      - name: Exercise MCP process boundary
        run: npm run smoke:mcp
      - name: Run frozen protocol fixture
        run: npm run eval:protocol
      - name: Audit dependency graph
        run: npm audit --audit-level=high
